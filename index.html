<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corazón de Origen - Trazabilidad y Origen</title>
    <!-- Tailwind CSS para diseño rápido y escalable -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 text-stone-800 font-sans antialiased">

    <!-- SECCIÓN 1: Encabezado y Logo (MANTENIDO) -->
    <header class="bg-white shadow-sm py-6 text-center">
        <img src="img/LOGO.jpg" alt="Logo del Café" class="h-20 mx-auto mb-2">
        <h1 class="text-2xl font-bold text-amber-900">Nuestro Café</h1>
        <p class="text-sm text-stone-500">Del campo a tu taza</p>
    </header>

    <!-- SECCIÓN 2: Imagen Principal del Producto (MANTENIDO) -->
    <main class="max-w-md mx-auto p-4">
        <div class="bg-white rounded-xl shadow-md overflow-hidden mb-6">
            <img src="img/empaque.jpg" alt="Empaque de café" class="w-full h-64 object-cover">
            <div class="p-5">
                <h2 class="text-xl font-bold mb-2">Tueste Especial</h2>
                <p class="text-stone-600 mb-4">Descubre las notas de sabor y la historia detrás de este lote único.</p>
            </div>
        </div>
    </main>

    <!-- SECCIÓN 4 (INCREMENTAL): Galería Dinámica (Carrusel) -->
    <section class="max-w-md mx-auto p-4 mb-6">
        <h3 class="text-lg font-bold text-amber-900 mb-3 border-b border-stone-200 pb-1">El proceso en la Finca</h3>
        
        <!-- Contenedor principal del carrusel con bordes redondeados -->
        <div class="relative w-full h-64 overflow-hidden rounded-xl shadow-md bg-stone-200">
            <!-- La "cinta" que contiene todas las fotos y se desliza -->
            <div id="cinta-carrusel" class="flex transition-transform duration-700 ease-in-out h-full w-full">
                <img src="img/finca1.jpg" class="w-full h-full object-cover flex-shrink-0" alt="Cultivo de café">
                <img src="img/finca111.jpg" class="w-full h-full object-cover flex-shrink-0" alt="Cultivo de café">
                <img src="img/finca11.jpg" class="w-full h-full object-cover flex-shrink-0" alt="Cultivo de café">
                <img src="img/finca2.jpg" class="w-full h-full object-cover flex-shrink-0" alt="Cosecha de granos">
                <img src="img/finca222.jpg" class="w-full h-full object-cover flex-shrink-0" alt="Cosecha de granos">
                <img src="img/finca22.jpg" class="w-full h-full object-cover flex-shrink-0" alt="Cosecha de granos">
                <img src="img/finca3.jpg" class="w-full h-full object-cover flex-shrink-0" alt="Proceso de tostado">
                <img src="img/finca33.jpg" class="w-full h-full object-cover flex-shrink-0" alt="Proceso de tostado">
            </div>
        </div>
    </section>

    <!-- SECCIÓN 3: Pie de página base (MANTENIDO) -->
    <footer class="text-center py-6 text-stone-400 text-xs">
        <p>© 2026 Cultivado de forma sustentable.</p>
    </footer>

    <!-- SCRIPT (INCREMENTAL): Motor del carrusel automático -->
    <script>
        const cinta = document.getElementById('cinta-carrusel');
        const imagenes = cinta.children;
        const totalImagenes = imagenes.length;
        let indiceActual = 0;

        function avanzarPresentacion() {
            indiceActual++;
            if (indiceActual >= totalImagenes) {
                indiceActual = 0; 
            }
            cinta.style.transform = `translateX(-${indiceActual * 100}%)`;
        }

        setInterval(avanzarPresentacion, 3500);
    </script>
</body>
</html>
